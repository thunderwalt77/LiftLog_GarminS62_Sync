name: Garmin S62 APK
# Builds an installable APK of this fork (LiftLog with Garmin S62 sync) for sideloading.
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS (key alias "liftlog")
# so every build installs over the previous one. Without them the APK is debug-signed.
on:
  push:
    branches: [garmin-s62-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./app/package-lock.json
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install
        run: npm ci
        working-directory: ./app
      - name: Test
        run: npx vitest run
        working-directory: ./app
      - name: Prebuild
        run: npm run prebuild
        working-directory: ./app
      - name: Put keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > liftlog.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"
        working-directory: ./app/android/app
      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SIGNING_ARGS: ${{ steps.keystore.outputs.signed == 'true' && '-PANDROID_UPLOAD_STORE_FILE=liftlog.keystore -PANDROID_UPLOAD_KEY_ALIAS=liftlog' || '' }}
        run: ./gradlew assembleRelease
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          -Pkotlin.daemon.jvmargs=-Xmx2g
          -PreactNativeArchitectures=arm64-v8a
          "-PBUILD_NUMBER=${{ github.run_number }}"
          $SIGNING_ARGS
        working-directory: ./app/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liftlog-garmin-s62-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
